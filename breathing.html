<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Take a Breath | Calmly</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="header">

        <a href="index.html" class="logo">
            Calmly.
        </a>

        <a href="index.html" class="back-home">
            ← Back home
        </a>

    </header>


    <main class="breathing-page">

        <section class="breathing-container">

            <p class="eyebrow">A little pause</p>

            <h1>Take a breath.</h1>

            <p class="breathing-intro">
                Follow the circle and take slow, comfortable breaths.
                There's no need to rush.
            </p>


            <div class="breathing-circle" id="breathingCircle">
                <span id="breathingText">Get ready...</span>
            </div>


            <p id="breathingTimer">Starting soon</p>


            <button id="startBreathing">
                Start exercise
            </button>

        </section>

    </main>


    <script src="breathing.js"></script>

</body>

</html>
